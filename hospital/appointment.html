<!-- PAGE BANNER -->

<section class="page-banner">

<h1>Book an Appointment</h1>

<!-- APPOINTMENT SECTION -->

<section class="appointment-page">

<div class="appointment-image">

<img src="images/appointment.png" alt="Appointment">

</div>

<div class="appointment-form">

<h2>Schedule Your Visit</h2>

<form>

<input type="text" placeholder="Full Name" required>

<input type="number" placeholder="Age" required>

<input type="tel" placeholder="Mobile Number" required>

<select required>

<option>Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

<select required>

<option>Select Department</option>
<option>Cardiology</option>
<option>Neurology</option>
<option>Orthopedics</option>
<option>Pediatrics</option>
<option>Gynecology</option>
<option>Dermatology</option>
<option>General Medicine</option>

</select>

<select required>

<option>Select Doctor</option>
<option>Dr. Renu Sree</option>
<option>Dr. Arjun Verma</option>
<option>Dr. Rahul Sharma</option>
<option>Dr. Priya Nair</option>

</select>

<input type="date" required>

<input type="time" required>

<textarea rows="5" placeholder="Describe Your Health Problem"></textarea>

<button type="submit">Book Appointment</button>

</form>

</div>

</section>
