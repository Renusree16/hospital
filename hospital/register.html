<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Patient Registration | Renusree Hospital</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">

            <img src="images/logo.png">

            <h2>Renusree Multi Speciality Hospital</h2>

        </div>

    </nav>

</header>


<section class="page-banner">

    <h1>Patient Registration</h1>

</section>


<section class="login-section">

    <div class="login-box">

        <h2>Create Account</h2>

        <p>Register as a new patient</p>

        <form id="registerForm">

            <input
                type="text"
                id="registerName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="tel"
                id="registerMobile"
                placeholder="Mobile Number"
                required
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Create Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p class="register-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</section>


<footer>

    <p>
        © 2026 Renusree Multi Speciality Hospital |
        All Rights Reserved
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
